# loop.toml
#
# The per-repo configuration seam for the delivery loop. Copy this file and
# change what differs for your repository.
#
# Where the loop looks. The loop reads the configuration from three places, in
# this order:
#
#   1. `loop.toml` at the root of the repository.
#   2. `~/.config/delivery-loop/<repo-slug>.toml` in your home directory.
#   3. The built-in defaults.
#
# The repo slug is the name of the directory of the main checkout. Every
# worktree of one repository uses the same slug, so one user file configures
# all of them. The loop merges the files key by key: a key in the repository
# file wins over the same key in the user file, and a key that no file sets
# keeps its default. A `[[stages]]` array replaces the whole stage list. Both
# files are optional. A team can commit a `loop.toml` to share it. You can keep
# a user file for values that belong to you, for example the session label.
# Two repositories whose main checkouts have the same directory
# name share one slug, and so share one user file.
#
# The carve-out lists are the exception to the merge. The entries in each file
# are added to the built-in carve-outs. The built-in carve-outs also stay in
# force under `.claude`, even if a file moves state_dir. So no file can remove a
# carve-out. `loop.toml` itself is a built-in carve-out, so a run cannot edit it.
#
# Two kinds of key live here. The keys `core/config.py` reads are shown below
# with the value the loop uses when the key is absent. If you delete a key from
# the repository file, the user file or the default supplies it. If you write a
# key, it overrides the user file, even when it holds the default value. So the
# keys that usually belong to one person, session_label and [tracker], are
# shipped commented out. Uncomment one only to share it with the whole team.
# The keys marked "not read yet" are the shape the
# loop is heading for; nothing reads them today, and an unread key is ignored
# rather than refused.
#
# This is a template. Nothing in templates/ is read at run time.
#
# Placeholders. A path key may write `{state_dir}`, `{state_file}` or
# `{state_stem}` and the loader substitutes them once when the config is built,
# so moving the harness directory moves the carve-outs, the loop prefixes and
# the ledger with it. `{state_file}` and `{state_stem}` give the state file's
# name only: the file lives under `state_root`, not under `state_dir`. The
# tracker pattern takes
# `{tracker_prefix}` the same way, the ledger name takes `{slug}`, and a stage
# prompt takes `{name}`.
#
# What the loader refuses: an absolute or parent-escaping path (state_root
# excepted, which must be absolute or start with ~), an empty value,
# a tracker pattern that does not compile, a value of the wrong type, and the
# stage rules listed under [[stages]] below.


[harness]
# The directory the harness keeps its own files in, inside a worktree.
state_dir = ".claude"

# Where every run's state lives, outside any repository, so the host
# repository needs no ignore rule. Each worktree gets its own directory,
# runs/<owner>-<repo>/<worktree>-<hash>/, and loop-scan reads them all. The
# hook and every command must agree on this place, so these two keys are read
# only from a file named with --config. A loop.toml the loop finds by itself,
# and the user file, may not set them. To move the state for everything, set
# the DELIVERY_LOOP_HOME environment variable.
# state_root = "~/.delivery-loop"
# state_file = "state.json"

# How a decision card names the session the run is in.
# session_label = "Session"


[ledger]
# The supervisor's own ledger: one file per repository slug, in this directory
# under the operator's home. The lock sits beside it. The name must end in
# .jsonl, so the ledger can never be an existing file such as a dotfile.
dir = "{state_dir}/supervisor"
name = "{slug}-ledger.local.jsonl"


[loop_paths]
# The enforcement files no declaration may ever authorize. Keep this list
# short and exact: every entry is a file the loop refuses to let a run edit
# while it is running. The entries you write here are added to the built-in
# list. You cannot remove a built-in entry.
carve_outs = [
    "{state_dir}/settings.json",
    "{state_dir}/settings.local.json",
    "{state_dir}/hooks/pipeline_guard.py",
    "{state_dir}/hooks/pipeline_stop.py",
    "{state_dir}/hooks/pipeline-guard",
    "{state_dir}/hooks/pipeline-stop",
    "{state_dir}/hooks/pipeline_loop_paths.py",
    "loop.toml",
    ".git",
]

# Carve-out by prefix, for a whole directory. Each entry ends in a slash. The
# entries are added to the built-in list, as for carve_outs.
carve_out_prefixes = [".git/"]

# The region a declaration may name at all, by prefix and exactly. A path
# outside it is rejected before the carve-out is even consulted.
prefixes = ["{state_dir}/hooks/", "{state_dir}/skills/pipeline/"]
exact = ["{state_dir}/settings.json"]

# The shorthand a declaration may use for a stage prompt, and what it expands
# to. `stages/ship.md` is the same declaration as the full path.
stage_shorthand = "stages/"
stage_target = "{state_dir}/skills/pipeline/stages/"


[commands]
# The operator commands a decision card quotes, in the host harness's own
# spelling. A card tells a person what to type, so these must be real.
resume = "/pipeline resume"
abort = "/pipeline abort"

# The command a stage invokes is not here. It is the `command` key of that
# stage under [[stages]] below, so a stage carries its whole contract in one
# place.


# The stages, in order. This array is the loop itself: the loop runs these
# stages, in this order, and nothing else. The five below are the default, so a
# host that deletes the whole array runs exactly them. A host with another
# skillset writes its own array and the loop drives that instead.
#
# A stage declares a contract, not only a name, because the loop depends on more
# than the command it calls. These are the keys, each with the value it takes
# when the key is absent:
#
#   name          required. The stage's name everywhere: in the state file, in
#                 the attempts map, and in what a person is shown. It must be
#                 unique, and safe as a file name component.
#   command       "". The harness command the stage invokes. Empty means the
#                 model does the work directly, with no skill behind it.
#   prompt        "{name}.md". The stage's prompt file, relative to the prompts
#                 directory. It may not be absolute and may not escape that
#                 directory.
#   emits         "". What the stage must leave behind for the next one, in a
#                 phrase. Empty means it leaves nothing the next stage reads.
#   clean_tree    false. True when the stage's finishing token is only accepted
#                 over a committed worktree.
#   gate          "none". Whether the stage stops for a person: "none" never,
#                 "approval" at an approval question, "review_batch" at a batch
#                 of review questions. Nothing else is accepted.
#   sandbox_off   false. True when the stage cannot run under the agent sandbox.
#
# The loader refuses an empty array, a table with no name, two stages of one
# name, a gate outside the three above, and a prompt path that escapes the
# prompts directory.

[[stages]]
name = "autoplan"
command = "/autoplan"
prompt = "autoplan.md"
# The next stage builds this plan, so the path is the whole handover.
emits = "PLAN: the absolute path of the plan file"
# The planner writes outside the worktree, so the tree is not checked here.
clean_tree = false
# The one stop a clean run makes: the final approval question on the plan.
gate = "approval"

[[stages]]
name = "implement"
# No command: the model builds the plan itself, with no skill behind it.
command = ""
prompt = "implement.md"
emits = ""
clean_tree = true
gate = "none"

[[stages]]
name = "qa"
command = "/qa"
prompt = "qa.md"
emits = ""
clean_tree = true
gate = "none"
# The qa skill drives a browser, which the agent sandbox blocks.
sandbox_off = true

[[stages]]
name = "review"
command = "/review"
prompt = "review.md"
emits = ""
clean_tree = true
# The review asks its questions in one batch, when it has any.
gate = "review_batch"

[[stages]]
name = "ship"
command = "/ship"
prompt = "ship.md"
# The last stage: it opens the pull request and prints the run's done token.
emits = "PR: the pull request url, then the run's done token"
clean_tree = true
gate = "none"


[tracker]
# The issue prefix, and the pattern that recognises one issue identifier
# inside a longer name such as a worktree directory. The prefix is a regular
# expression. The default matches any letters, so it finds `ENG-12` and
# `abc-21`. The first match in the name wins, so `release-2024-abc-21` reads as
# `release-2024`. If your tracker has one known prefix, set it here. The
# pattern is matched case-sensitively, so spell it the way the worktree names
# are spelled.
# prefix = "[A-Za-z]+"
# pattern = "({tracker_prefix}-\\d+)"

# Not read yet. The tracker team, project and milestone the loop files and
# updates work against, named as the tracker itself shows them.
# team = ""
# project = ""
# milestone = ""


[gates]
# Not read yet. Commands the loop invokes to decide whether work passes. The
# host repository defines what each one runs. The loop only runs the command
# and reads its exit code.
#
# check: the single gate the loop runs before it will advance past implement.
# A host repository typically points this at its own aggregate target.
check = ""

# Further named gates the host wants the loop to be able to invoke. The key is
# the name a prompt refers to; the value is the command. Which extra names the
# loop understands is unsettled.
# [gates.extra]
# lint = ""
# test = ""


[qa]
# Not read yet. The qa route table. Maps a kind of change to the qa route that
# change takes. The key is the route name a prompt refers to; the value is what
# the host runs or the procedure it follows. The closed set of route names is
# unsettled.
# [qa.routes]
# data = ""
# tool = ""
# docs = ""


[repo]
# Not read yet. The repository slug, in owner/name form. The supervisor takes
# it on the command line today.
slug = ""

# The pattern the loop expands to build a pull request URL. Placeholders are
# unsettled; the current intent is one placeholder for the pull request number.
pull_request_url = ""


[zones]
# Not read yet. Path to the zone map, relative to the host repository root. The
# zone map says which part of the repository a path belongs to. Its file format
# is unsettled.
map = ""
