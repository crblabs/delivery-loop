[project]
name = "delivery-loop"
version = "0.1.0"
description = "A harness-neutral delivery loop and the supervisor that watches it"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loop-scan = "core.supervisor_scan:main"
loop-decide = "core.supervisor_decide:main"
loop-card = "core.supervisor_card:main"
loop-card-check = "core.card_shape:main"
loop-pause-stats = "core.supervisor_pause_stats:main"
loop-prune = "core.supervisor_prune:main"
loop-transcript = "adapters.claude_code.supervisor_transcript:main"
loop-no-dash = "core.no_unicode_dash:main"
loop-comments = "core.comments_gate:main"
loop-complexity = "core.complexity_gate:main"
loop-pr-body = "core.pr_body:main"
loop-pr-decisions = "core.pr_decisions:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff formats fenced Python inside markdown too, and the contract docs are
# prose with illustrative sketches, not code to be reformatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These run on any python3 a machine ships, down to 3.8, so a person whose
# interpreter changed under a run can still end it. pyupgrade would rewrite
# them for the 3.11 floor; tests/test_run_index.py parses them as 3.8.
"core/run_index.py" = ["UP"]
"adapters/claude_code/bootstrap.py" = ["UP"]
"hooks/*.py" = ["UP"]
"bin/*" = ["UP"]
