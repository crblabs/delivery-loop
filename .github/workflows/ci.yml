name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor in pyproject.toml, and every version above it.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The full history, so the branch rules find the merge base with the base branch.
          fetch-depth: 0

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and the dev group
        run: uv sync

      # Each step runs from scripts/check.sh, the same script the pre-push hook
      # runs, so a local check and CI cannot drift apart.
      - name: Run the tests
        run: scripts/check.sh tests

      - name: Lint
        run: scripts/check.sh lint

      - name: Check formatting
        run: scripts/check.sh format

      - name: Check the house rules
        env:
          # The patterns live in the repository variable, never in a file.
          FORBIDDEN: ${{ vars.FORBIDDEN_NAMES }}
        run: scripts/check.sh rules

      # loop-no-dash, loop-comments and loop-complexity over the pull request's
      # diff, the rules a delivery-loop stage enforces, so this repository passes
      # its own rules.
      - name: Check the branch against its base
        if: github.event_name == 'pull_request'
        env:
          CHECK_BASE: origin/${{ github.base_ref }}
        run: scripts/check.sh branch
